services:
  - type: web
    name: nexus-guardian-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HONEYPOT_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
